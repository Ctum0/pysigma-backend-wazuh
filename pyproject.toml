[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysigma-backend-wazuh"
version = "0.1.0"
description = "pySigma backend for Wazuh SIEM XML ruleset"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "pySigma-backend-wazuh contributors" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "pysigma>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "sigma-cli>=3.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "lxml>=4.9.0",
]

[project.entry-points."sigma.backends"]
wazuh = "sigma.backends.wazuh:WazuhBackend"

[project.entry-points."sigma.pipelines"]
wazuh_windows = "sigma.pipelines.wazuh:wazuh_windows_pipeline"
wazuh_linux = "sigma.pipelines.wazuh:wazuh_linux_pipeline"
wazuh_web = "sigma.pipelines.wazuh:wazuh_web_pipeline"
wazuh = "sigma.pipelines.wazuh:wazuh_combined_pipeline"

[tool.hatch.build.targets.wheel]
packages = ["sigma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
